worker_processes auto;

events {
    worker_connections 256;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile    on;
    tcp_nopush  on;
    server_tokens off;

    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    client_max_body_size 10M;

    # location 側で proxy_set_header を書かない限り、全 location に継承される
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    ssl_certificate     /etc/letsencrypt/live/musicportfolioai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/musicportfolioai.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    upstream backend {
        server backend:3001;
    }

    upstream frontend {
        server frontend:3000;
    }

    # HTTP: 証明書更新 (ACME challenge) 以外は HTTPS の apex へ転送
    server {
        listen 80;
        server_name musicportfolioai.com www.musicportfolioai.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://musicportfolioai.com$request_uri;
        }
    }

    # HTTPS www: apex へ統一
    server {
        listen 443 ssl;
        http2 on;
        server_name www.musicportfolioai.com;

        return 301 https://musicportfolioai.com$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name musicportfolioai.com;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;

        location /api/ {
            proxy_pass http://backend;
        }

        location = /auth {
            proxy_pass http://backend;
        }

        location /auth/ {
            proxy_pass http://backend;
        }

        location / {
            proxy_pass http://frontend;
        }
    }
}
